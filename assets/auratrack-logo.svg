<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="auraLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Group -->
  <g transform="translate(4, 4)">
    <circle cx="28" cy="28" r="26" fill="#0F172A" stroke="url(#auraLogoGrad)" stroke-width="2" />
    <circle cx="28" cy="28" r="20" stroke="url(#auraLogoGrad)" stroke-width="3" stroke-dasharray="80 20" />
    <path d="M 28 14 A 14 14 0 0 1 42 28" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" filter="url(#logoGlow)" />
    <line x1="28" y1="28" x2="28" y2="17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="28" x2="38" y2="28" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="28" cy="28" r="4" fill="#FFFFFF" />
    <circle cx="28" cy="28" r="2" fill="#6366F1" />
  </g>

  <!-- Typography -->
  <text x="74" y="38" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Aura<tspan fill="url(#textGrad)">Track</tspan>
  </text>
  <text x="75" y="52" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="2.5">
    INTELLIGENCE
  </text>
</svg>
