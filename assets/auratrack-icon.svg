<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="auraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#pulseGlow)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6" />
  
  <!-- Outer Glow Arc -->
  <path d="M 50 12 A 38 38 0 0 1 88 50" stroke="url(#auraGradient)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Main Orbital Track & Clock Hand Symbol -->
  <circle cx="50" cy="50" r="32" stroke="url(#auraGradient)" stroke-width="5" stroke-linecap="round" stroke-dasharray="140 30" />
  
  <!-- Inner Time Needle -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="68" y2="50" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  
  <!-- Center Core Node -->
  <circle cx="50" cy="50" r="5.5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="50" cy="50" r="2.5" fill="#6366F1" />
</svg>
